<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leandro Cordeiro | .NET Developer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #512bd4;
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-dim: #94a3b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header,
      .hero,
      .container {
        animation: fadeInUp 1s ease forwards;
      }

      header {
        height: 80px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .hero {
        height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      .hero h1 {
        font-size: 3.5rem;
        margin-bottom: 15px;
      }

      /* AJUSTE AQUI: O container agora limita a largura ao texto */
      .typing-container {
        display: inline-block;
        margin-bottom: 20px;
      }

      .typing {
        font-size: 1.2rem;
        color: var(--text-dim);
        border-right: 3px solid var(--primary);
        white-space: nowrap;
        overflow: hidden;
        width: 0;
        /* O segredo está em limitar o width ao tamanho do conteúdo */
        animation:
          typing 3.5s steps(45, end) forwards,
          blink 0.75s step-end infinite;
      }

      /* Ajuste no keyframe para o tamanho exato do texto */
      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes blink {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: var(--primary);
        }
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      #repo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
      }

      .card {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 15px;
        border: 1px solid #334155;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        text-decoration: none;
        color: inherit;
      }
      .card h3 {
        color: var(--text-main); /* Mudado para branco */
        font-family: "Fira Code", monospace;
        font-size: 1.1rem;
        transition: color 0.3s ease; /* Transição suave para o hover */
      }

      .card:hover h3 {
        color: var(
          --primary
        ); /* O título volta a ser roxo quando passas o rato */
      }

      .lang {
        margin-top: 15px;
        display: inline-block;
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--primary);
        font-weight: bold;
        opacity: 0.8;
      }

      footer {
        text-align: center;
        padding: 60px;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <div style="font-weight: 800; font-size: 1.5rem">
        LC<span style="color: var(--primary)">.</span>
      </div>
    </header>

    <section class="hero">
      <h1>
        Hello, I'm <span style="color: var(--primary)">Leandro Cordeiro</span>
      </h1>

      <!-- Wrapper para controlar a largura da animação -->
      <div class="typing-container">
        <p class="typing">
          Junior Developer focused on learning and transforming logic.
        </p>
      </div>

      <div>
        <a
          href="https://github.com/LeandroCordeiro97"
          target="_blank"
          style="
            color: var(--text-dim);
            text-decoration: none;
            font-family: &quot;Fira Code&quot;;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--primary);
            padding-bottom: 2px;
          "
          >github.com/LeandroCordeiro97</a
        >
      </div>
    </section>

    <main class="container">
      <h2 style="margin-bottom: 30px; font-weight: 400">Recent Projects</h2>
      <div id="repo-grid">
        <!-- Dinâmico via JS -->
      </div>
    </main>

    <footer>&copy; 2026 | Leandro Cordeiro</footer>

    <script>
      async function fetchRepos() {
        const username = "LeandroCordeiro97";
        const grid = document.getElementById("repo-grid");

        try {
          const response = await fetch(
            `https://api.github.com/users/${username}/repos?sort=updated&per_page=6`,
          );
          const repos = await response.json();
          grid.innerHTML = "";

          repos.forEach((repo, index) => {
            const card = document.createElement("a");
            card.className = "card";
            card.href = repo.html_url;
            card.target = "_blank";
            card.style.animation = `fadeInUp 0.8s ease forwards ${index * 0.15}s`;
            card.style.opacity = "0";

            card.innerHTML = `
            <h3>${repo.name}</h3>
            <span class="lang">${repo.language || "Software"}</span>
        `;
            grid.appendChild(card);
          });
        } catch (e) {
          grid.innerHTML = "<p>Erro ao carregar repositórios.</p>";
        }
      }
      fetchRepos();
    </script>
  </body>
</html>
